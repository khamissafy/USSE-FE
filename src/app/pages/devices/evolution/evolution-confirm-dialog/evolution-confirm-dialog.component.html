<h2 mat-dialog-title>{{ data.titleKey | translate }}</h2>
<mat-dialog-content>
  <p>{{ data.messageKey | translate }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>{{ 'CANCEL' | translate }}</button>
  <button mat-flat-button color="warn" type="button" [mat-dialog-close]="true">{{ data.confirmKey | translate }}</button>
</mat-dialog-actions>
