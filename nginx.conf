server {
    listen 80;
    server_name localhost;

    # Docker embedded DNS — re-resolve commswift after container recreate (static proxy_pass caches IP at startup)
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;

    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API reverse proxy -> Qweira-BE
    # Browser uses /api/ (relative), nginx routes to commswift:5300 inside app_network
    # $commswift forces runtime DNS (see resolver); plain proxy_pass would cache commswift's IP forever
    location /api/ {
        set $commswift_upstream commswift;
        client_max_body_size 55m;
        proxy_request_buffering off;
        # No URI suffix on proxy_pass: required when upstream host is a variable (full $request_uri is forwarded)
        proxy_pass         http://$commswift_upstream:5300;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SignalR reverse proxy (WebSocket upgrade required)
    location /signalr {
        set $commswift_upstream commswift;
        proxy_pass         http://$commswift_upstream:5300;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
