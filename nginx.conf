server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA fallback -- client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API reverse proxy -> Qweira-BE
    # Browser uses /api/ (relative), nginx routes to commswift:5300 inside app_network
    location /api/ {
        proxy_pass         http://commswift:5300/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SignalR reverse proxy (WebSocket upgrade required)
    location /signalr {
        proxy_pass         http://commswift:5300/signalr;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
